<div class="card tree-info-card" id="tree-info" style="display: none;">
  <div class="card-header">
    <div class="certification-badge" id="certification-badge"></div>
    <h2>Información del árbol</h2>
  </div>

  <div class="tree-content">
    <div class="tree-image-container" id="tree-image-container">
      <img id="tree-image" src="" alt="Imagen de la especie" class="tree-image">
    </div>

    <div class="tree-details">
      <div class="detail-row">
        <span class="detail-label">ID:</span>
        <span class="detail-value" id="tree-id">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Especie:</span>
        <span class="detail-value" id="tree-species">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Fecha de tala:</span>
        <span class="detail-value" id="tree-date">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Ubicación:</span>
        <span class="detail-value" id="tree-location">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Estado de certificación:</span>
        <span class="detail-value" id="tree-certification">-</span>
      </div>
      <div class="detail-row" id="tree-additional-info-container" style="display: none;">
        <span class="detail-label">Información adicional:</span>
        <span class="detail-value" id="tree-additional-info">-</span>
      </div>
    </div>
  </div>

  <div class="card-actions">
    <button id="scan-again-btn" class="button primary-button">Escanear otro código</button>
  </div>
</div>
